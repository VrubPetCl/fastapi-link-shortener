<tr id="link-{{ link['id'] }}">
    <td class="px-6 py-4 whitespace-nowrap">
        <div class="flex items-center">
            <code class="text-sm font-mono bg-gray-100 px-2 py-1 rounded">{{ link['short_code'] }}</code>
            <button
                onclick="navigator.clipboard.writeText(window.location.origin + '/{{ link['short_code'] }}')"
                class="ml-2 text-blue-600 hover:text-blue-800"
                title="Copy link"
            >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
            </button>
        </div>
    </td>
    <td class="px-6 py-4">
        <div class="text-sm text-gray-900 truncate max-w-md" title="{{ link['original_url'] }}">
            {{ link['original_url'] }}
        </div>
    </td>
    <td class="px-6 py-4 whitespace-nowrap">
        <span class="text-sm text-gray-900">{{ link['clicks'] }}</span>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
        {{ link['created_at'][:10] }}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm space-x-2">
        <button
            hx-get="/d/links/{{ link['id'] }}/stats"
            hx-target="#stats-content"
            class="text-blue-600 hover:text-blue-800"
        >
            Stats
        </button>
        <button
            hx-delete="/d/links/{{ link['id'] }}"
            hx-confirm="Are you sure you want to delete this link?"
            hx-target="#link-{{ link['id'] }}"
            hx-swap="outerHTML swap:1s"
            class="text-red-600 hover:text-red-800"
        >
            Delete
        </button>
    </td>
</tr>
