{% extends "base.html" %}

{% block title %}Protected link{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8 flex justify-center">
    <div class="bg-white p-6 rounded-lg shadow-md max-w-sm w-full mt-10">
        <div class="text-center mb-6">
            <svg class="mx-auto h-12 w-12 text-gray-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            <h1 class="text-xl font-bold text-gray-800">This link is protected</h1>
        </div>

        <form method="POST" action="/{{ short_code }}" class="space-y-4">
            {% if error %}
            <div class="text-red-600 text-sm mb-2 text-center">{{ error }}</div>
            {% endif %}

            <div>
                <input
                    type="password"
                    name="password"
                    required
                    autofocus
                    placeholder="Enter password"
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                >
            </div>

            <button
                type="submit"
                class="w-full bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition duration-200"
            >
                Unlock
            </button>
        </form>
    </div>
</div>
{% endblock %}
