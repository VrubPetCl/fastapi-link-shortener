{% extends "base.html" %}

{% block title %}URL Shortener - Home{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-16">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-5xl font-bold text-center text-gray-800 mb-8">URL Shortener</h1>
        <p class="text-xl text-center text-gray-600 mb-12">
            Create short, memorable links for your long URLs
        </p>

        <div class="grid md:grid-cols-2 gap-8">
            <!-- Login Form -->
            <div class="bg-white p-8 rounded-lg shadow-md">
                <h2 class="text-2xl font-bold mb-6 text-gray-800">Login</h2>
                <form action="/auth/login" method="POST" class="space-y-4">
                    <div>
                        <label for="login-email" class="block text-sm font-medium text-gray-700 mb-2">
                            Email
                        </label>
                        <input
                            type="email"
                            id="login-email"
                            name="email"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        >
                    </div>
                    <div>
                        <label for="login-password" class="block text-sm font-medium text-gray-700 mb-2">
                            Password
                        </label>
                        <input
                            type="password"
                            id="login-password"
                            name="password"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        >
                    </div>
                    <button
                        type="submit"
                        class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200"
                    >
                        Login
                    </button>
                </form>
            </div>

            <!-- Register Form -->
            <div class="bg-white p-8 rounded-lg shadow-md">
                <h2 class="text-2xl font-bold mb-6 text-gray-800">Register</h2>
                <form action="/auth/register" method="POST" class="space-y-4">
                    <div>
                        <label for="register-email" class="block text-sm font-medium text-gray-700 mb-2">
                            Email
                        </label>
                        <input
                            type="email"
                            id="register-email"
                            name="email"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-transparent"
                        >
                    </div>
                    <div>
                        <label for="register-password" class="block text-sm font-medium text-gray-700 mb-2">
                            Password (min 8 characters)
                        </label>
                        <input
                            type="password"
                            id="register-password"
                            name="password"
                            required
                            minlength="8"
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-transparent"
                        >
                    </div>
                    <button
                        type="submit"
                        class="w-full bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 transition duration-200"
                    >
                        Register
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
